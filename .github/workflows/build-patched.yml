# Build the patched MO2 core (v2.5.2 + 0001 + 0002) and publish the exe.
#
# The build action is vendored (.github/actions/mob-build) and pinned to the
# 2.5.2-era mob tag, so the produced exe links against exactly the same
# Qt/Python/pybind11 ABI as a stock MO2 2.5.2 install. The upstream action
# itself does NOT upload anything, hence the explicit upload-artifact step.

name: Build MO2 core (VFS upgrade 0001 + 0002)

on:
  push:
    branches: [patched-core]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Assert both core patches are committed
        shell: bash
        run: |
          set -e
          for f in src/vfscoreconfig.h src/gameprofileconfig.h; do
            test -f "$f" || { echo "missing $f - patch not applied"; exit 1; }
          done
          grep -q "vfsCoreCachedConfig" src/organizercore.cpp
          grep -q "gameProfileIsBareMod" src/organizercore.cpp
          grep -q "gameProfileSeedSaves" src/organizercore.cpp
          grep -q "gameProfileGroup" src/settingsdialog.ui
          grep -q "gameProfileSnapshot" src/savestab.cpp
          echo "both core patches present"

  build:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build patched ModOrganizer 2
        uses: ./.github/actions/mob-build
        with:
          mo2-owner: ModOrganizer2
          mo2-branch: v2.5.2
          mob-ref: v2.5.2
          qt-version: 6.7.1
          qt-modules: qtpositioning qtwebchannel qtwebengine qtwebsockets
          mo2-third-parties: >-
            7z zlib gtest libbsarch libloot openssl bzip2 python lz4 spdlog
            boost boost-di sip pyqt pybind11 ss licenses explorerpp DirectXTex
          mo2-dependencies: >-
            usvfs cmake_common uibase githubpp bsatk esptk archive lootcli
            game_gamebryo

      - name: Collect the built executable
        shell: bash
        run: |
          set -e
          mkdir -p dist
          echo "candidate executables:"
          find . -type f -name 'ModOrganizer.exe' -print
          exe=$(find . -type f -name 'ModOrganizer.exe' -print | grep -i vsbuild | head -1)
          if [ -z "$exe" ]; then
            exe=$(find . -type f -name 'ModOrganizer.exe' -print | head -1)
          fi
          test -n "$exe" || { echo "ModOrganizer.exe not found"; exit 1; }
          cp "$exe" dist/ModOrganizer.exe
          ls -l dist/ModOrganizer.exe

      - name: Upload patched executable
        uses: actions/upload-artifact@v4
        with:
          name: patched-modorganizer-exe
          path: dist/ModOrganizer.exe
          if-no-files-found: error
          retention-days: 14
